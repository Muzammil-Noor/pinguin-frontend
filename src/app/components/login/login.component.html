<div class="min-h-screen bg-black flex flex-col justify-center items-center p-4">
    <div class="container max-w-md w-full rounded-xl p-1">
        <div class="bg-black w-full h-full rounded-[7px]">
            <div class="px-8 pt-8 pb-6">
                <img src="assets/Pinguin.png" alt="pinguin" class="w-20 h-auto mx-auto mb-2">
                <h2
                    class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-[#EB00FF] to-[#4075f9] mb-2 text-center">
                    Pinguin
                </h2>
            </div>

            <div class="p-8">
                <div class="mb-6 relative">
                    <label for="username" class="block text-gray-300 text-sm font-semibold mb-2 ml-1">Choose your
                        identity</label>
                    <div class="relative">
                        <input type="text" id="username" [(ngModel)]="username" (keyup.enter)="join()"
                            class="w-full bg-gray-950 text-white border border-gray-700 rounded-lg py-3 px-4 focus:outline-none focus:ring-2 focus:ring-[#c51ce9]/50 focus:border-transparent transition-all duration-300 shadow-inner"
                            placeholder="Enter username" autocomplete="off" [disabled]="isLoading" />
                    </div>
                    <p *ngIf="error" class="text-red-400 text-xs italic mt-2 ml-1 animate-pulse">{{ error }}</p>
                </div>

                <button (click)="join()" [disabled]="isLoading || !username.trim()"
                    class="w-full bg-gradient-to-r from-[#c51ce9] to-[#4075f9] hover:from-[#d13df0] hover:to-[#5c8aff] text-white font-bold py-3.5 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-[#c51ce9]/30 transition-all duration-300 transform hover:-translate-y-0.5 shadow-lg flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                    <span *ngIf="!isLoading">Enter</span>
                    <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </button>
            </div>

            <div class="px-8 py-4 bg-gray-950/50 text-center">
                <p class="text-xs text-gray-500">
                    <span class="inline-block relative w-2 h-2 rounded-full bg-blue-500 mr-2">
                        <span
                            class="inline-block absolute top-0 left-0 w-2 h-2 rounded-full bg-purple-500 animate-pulse"></span>
                    </span>
                    Zero persistence. Zero logging.
                </p>
            </div>

        </div>
    </div>
</div>
